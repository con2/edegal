{{- if .Values.legacyMigration.enabled }}
# One-off legacy-to-v4 data migration Job (v4/docs/legacy-migration-plan.md). Uses the `-worker`
# image, not the small `-migrate` one: the migration script is app code (tsx, src/, sharp and the
# rest of the production dependencies), not a Prisma migration. It touches no media files, only
# the database, so it does not mount the NFS export.
apiVersion: batch/v1
kind: Job
metadata:
  name: legacy-migration-{{ .Values.legacyMigration.runId }}
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        stack: v4
        component: legacy-migration
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 1082
        runAsGroup: 1082
        fsGroup: 1082
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legacy-migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-worker"
          command:
            - node_modules/.bin/tsx
            - src/bin/migrate-legacy.ts
            - --report=/tmp/legacy-migration-report.txt
          args:
            {{- toYaml .Values.legacyMigration.args | nindent 12 }}
          envFrom:
            - configMapRef:
                name: v4
            - secretRef:
                name: {{ include "v4.secretName" . }}
          resources:
            {{- toYaml .Values.resources.legacyMigration | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
