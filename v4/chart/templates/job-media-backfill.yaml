{{- if .Values.mediaBackfill.enabled }}
# One-off pass over media rows the legacy migration left without a file size (chart/README.md,
# "Media backfill"). Uses the `-worker` image because the script is app code (tsx, src/, sharp).
# It only stats and reads headers from the media export, so the mount is read-only: the previews
# it finds to be wrong are regenerated by the worker Deployment through ordinary media jobs.
apiVersion: batch/v1
kind: Job
metadata:
  name: media-backfill-{{ .Values.mediaBackfill.runId }}
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        stack: v4
        component: media-backfill
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 1082
        runAsGroup: 1082
        fsGroup: 1082
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-backfill
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-worker"
          command:
            - node_modules/.bin/tsx
            - src/bin/backfill-media.ts
          args:
            {{- toYaml .Values.mediaBackfill.args | nindent 12 }}
          envFrom:
            - configMapRef:
                name: v4
            - secretRef:
                name: {{ include "v4.secretName" . }}
          resources:
            {{- toYaml .Values.resources.mediaBackfill | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/media
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          nfs:
            server: {{ .Values.mediaNfs.server }}
            path: {{ .Values.mediaNfs.path }}
            readOnly: true
        - name: tmp
          emptyDir: {}
{{- end }}
