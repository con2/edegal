# Generates previews and thumbnails for uploaded photos. Same image family, same NFS media volume
# (read-write), same configuration as the web Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      stack: v4
      component: worker
  template:
    metadata:
      labels:
        stack: v4
        component: worker
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      # One worker per node when possible, so the encodes do not compete for the same cores.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              stack: v4
              component: worker
      securityContext:
        runAsUser: 1082
        runAsGroup: 1082
        fsGroup: 1082
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-worker"
          envFrom:
            - configMapRef:
                name: v4
            - secretRef:
                name: {{ include "v4.secretName" . }}
          env:
            - name: WORKER_CONCURRENCY
              value: {{ .Values.workerConcurrency | quote }}
            # sharp runs its work on the libuv pool; below the slot count, slots would queue.
            - name: UV_THREADPOOL_SIZE
              value: {{ max 4 (int .Values.workerConcurrency) | quote }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          nfs:
            server: {{ .Values.mediaNfs.server }}
            path: {{ .Values.mediaNfs.path }}
        - name: tmp
          emptyDir: {}
