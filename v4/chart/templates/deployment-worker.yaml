# Generates previews and thumbnails for uploaded photos. Same image family, same NFS media volume
# (read-write), same configuration as the web Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      stack: v4
      component: worker
  template:
    metadata:
      labels:
        stack: v4
        component: worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1082
        runAsGroup: 1082
        fsGroup: 1082
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-worker"
          envFrom:
            - configMapRef:
                name: v4
            - secretRef:
                name: {{ include "v4.secretName" . }}
          env:
            - name: WORKER_CONCURRENCY
              value: {{ .Values.workerConcurrency | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          nfs:
            server: {{ .Values.mediaNfs.server }}
            path: {{ .Values.mediaNfs.path }}
        - name: tmp
          emptyDir: {}
