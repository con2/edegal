apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  labels:
    {{- include "v4.labels" . | nindent 4 }}
data:
  default.conf: |
    server_tokens off;
    server {
      listen 8080;
      server_name _;
      access_log off;
      # Same origin as the app: a stray HTML or SVG on the export must not run as a page.
      add_header X-Content-Type-Options nosniff always;
      location ~ /\. {
        deny all;
      }
      location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }
      location = /nginx-health {
        return 200 'OK';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      stack: v4
      component: nginx
  template:
    metadata:
      labels:
        stack: v4
        component: nginx
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1082
        runAsGroup: 1082
        fsGroup: 1082
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1-alpine
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: media
          nfs:
            server: {{ .Values.mediaNfs.server }}
            path: {{ .Values.mediaNfs.path }}
            readOnly: true
        - name: config
          configMap:
            name: nginx
