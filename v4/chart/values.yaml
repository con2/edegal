# Real environment values live in values-conikuvat.yaml and values-larppikuvat.yaml.
# This file's secret.* fields are obviously-bogus placeholders so `helm template`/`helm lint`
# work without real secrets -- never deploy with these values as-is.

image:
  # Normally supplied by --set at `helm upgrade` time in .github/workflows/v4.yaml.
  repository: ghcr.io/con2/edegal-v4
  tag: latest

hostname: v4.example.com
# Extra Certificate dnsNames. Lets the apex certificate issue before `hostname` moves to it, so the
# hostname flip has no TLS gap.
additionalHostnames: []

# Django admin of the legacy stack, reached at /admin with its static files at /static. An empty
# namespace disables both routes. The legacy namespace must grant the HTTPRoute access to the
# Service with a ReferenceGrant (v2-backend/kubernetes/referencegrant.in.yaml).
legacy:
  namespace: ""
  service: edegal
  port: 8000

# The legacy stack's media directory, shared read-write with this app (uid 1082 owns the files).
mediaNfs:
  server: 91.105.252.80
  path: /opt/conikuvat

kompassi:
  baseUrl: https://kompassi.eu
  photographerGroup: conikuvat-staff
  adminGroup: admins

legacyAdminUrl: https://conikuvat.fi/admin/

# Outgoing mail for the contact form. An empty hostname makes the form report the service as
# unavailable. SMTP_USERNAME and SMTP_PASSWORD, when the relay needs them, go in the Secret.
mail:
  smtpHostname: ""
  smtpPort: 587
  sender: edegal@localhost
  from: Edegal <edegal@localhost>

# Media worker: `replicas` processes with `workerConcurrency` parallel conversions each. Any number
# of processes may run at once; jobs are claimed with SKIP LOCKED and a job whose process died is
# requeued after 15 minutes.
worker:
  replicas: 4
workerConcurrency: 4

# Sized from production usage (node 140-530 MiB, worker 100-220 MiB idle, nginx mostly page cache).
# An upload holds up to 100 MB of body plus the decoded image (about 4 bytes per pixel, capped at
# 100 megapixels), and the worker decodes `workerConcurrency` images at once. Each AVIF encode
# runs libvips on one thread plus libaom's own four, so the worker's CPU limit stays above the
# slot count to avoid throttling mid-encode.
resources:
  node:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  worker:
    requests: { cpu: "2", memory: 1Gi }
    limits: { cpu: "5", memory: 4Gi }
  migrate:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  nginx:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: "1", memory: 512Mi }

# THE PRODUCTION-RECOMMENDED PATH: point at a pre-existing Secret with keys
# DATABASE_URL, AUTH_SECRET, KOMPASSI_OIDC_CLIENT_ID, KOMPASSI_OIDC_CLIENT_SECRET (and optionally
# SMTP_USERNAME, SMTP_PASSWORD) and the chart skips creating its own.
existingSecretName: ""
secret:
  databaseUrl: postgresql://changeme:changeme@postgres:5432/changeme
  authSecret: changeme
  kompassiClientId: changeme
  kompassiClientSecret: changeme
