services:
  test:
    build:
      context: .
      target: test
    init: true
    command:
      - sh
      - -c
      - scripts/wait-for-it.sh --strict postgres:5432 && ruff check . && ruff format --check . && python manage.py test
    # ports:
    #   - 8000:8000
    links:
      - postgres
    volumes:
      - ./edegal:/usr/src/app/edegal
    environment:
      DEBUG: 1
      PYTHONUNBUFFERED: 1
      DATABASE_URL: psql://edegal:edegal@postgres/edegal
      ALLOWED_HOSTS: '*'
  postgres:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: edegal
      POSTGRES_PASSWORD: edegal
      POSTGRES_DB: edegal
volumes:
  postgres-data: {}
  media: {}
