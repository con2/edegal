# Generates previews and thumbnails for uploaded photos. Same image family, same NFS media volume
# (read-write, while enabled), same configuration as the web Deployment. One worker per node: two
# on one node would compete for its cores, and a node that is down should mean one worker fewer.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: worker
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      stack: v4
      component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        stack: v4
        component: worker
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1082
        runAsGroup: 1082
        fsGroup: 1082
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-worker"
          envFrom:
            - configMapRef:
                name: v4
            - secretRef:
                name: {{ include "v4.secretName" . }}
          env:
            - name: WORKER_CONCURRENCY
              value: {{ .Values.workerConcurrency | quote }}
            # sharp runs its work on the libuv pool; below the slot count, slots would queue.
            - name: UV_THREADPOOL_SIZE
              value: {{ max 4 (int .Values.workerConcurrency) | quote }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            {{- if .Values.mediaNfs.enabled }}
            - name: media
              mountPath: /usr/src/app/media
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.mediaNfs.enabled }}
        - name: media
          nfs:
            server: {{ .Values.mediaNfs.server }}
            path: {{ .Values.mediaNfs.path }}
        {{- end }}
        - name: tmp
          emptyDir: {}
