apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  labels:
    {{- include "v4.labels" . | nindent 4 }}
data:
  default.conf: |
    server_tokens off;
    server {
      listen 8080;
      server_name _;
      access_log off;
      # Same origin as the app: a stray HTML or SVG on the export must not run as a page.
      add_header X-Content-Type-Options nosniff always;
      location ~ /\. {
        deny all;
      }
      location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }
      location = /nginx-health {
        return 200 'OK';
      }
    }
