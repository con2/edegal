{{- if .Values.mediaTask.enabled }}
# One-off media maintenance run of one src/bin script (chart/README.md, "Media backfill" and
# "Migrating media to S3"). Uses the `-worker` image because the scripts are app code (tsx, src/,
# sharp). The export, when mounted, is read-only: the scripts only stat and read legacy files, and
# every file they write goes to S3 or through ordinary media jobs handled by the worker Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: media-task-{{ .Values.mediaTask.runId }}
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        stack: v4
        component: media-task
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 1082
        runAsGroup: 1082
        fsGroup: 1082
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-task
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-worker"
          command:
            - node_modules/.bin/tsx
            - {{ .Values.mediaTask.script | quote }}
          args:
            {{- toYaml .Values.mediaTask.args | nindent 12 }}
          envFrom:
            - configMapRef:
                name: v4
            - secretRef:
                name: {{ include "v4.secretName" . }}
          resources:
            {{- toYaml .Values.resources.mediaTask | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            {{- if and .Values.mediaTask.nfs .Values.mediaNfs.enabled }}
            - name: media
              mountPath: /usr/src/app/media
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if and .Values.mediaTask.nfs .Values.mediaNfs.enabled }}
        - name: media
          nfs:
            server: {{ .Values.mediaNfs.server }}
            path: {{ .Values.mediaNfs.path }}
            readOnly: true
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
