# Plain HTTP only redirects to HTTPS. Done per app instead of at the Traefik entrypoint so
# cert-manager's HTTP-01 solver Ingress keeps working.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: v4
      sectionName: http
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  labels:
    {{- include "v4.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: v4
      sectionName: https
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /media/
      backendRefs:
        - name: nginx
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: node
          port: 3000
