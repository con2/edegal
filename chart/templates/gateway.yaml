# One Gateway per app namespace, attached to the cluster's Traefik GatewayClass. cert-manager
# issues the certificate for the https listener's hostname into the referenced Secret.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: v4
  labels:
    {{- include "v4.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "v4.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
